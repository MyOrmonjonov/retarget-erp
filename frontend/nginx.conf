server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - let react-router handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied to the backend service when both containers run together (e.g. docker-compose,
    # service name "backend"). If the frontend is deployed separately, set VITE_API_URL /
    # VITE_WS_URL to the backend's real origin at build time instead and remove these blocks.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
