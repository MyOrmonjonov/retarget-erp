spring:
  application:
    name: crm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:dev-secret}
