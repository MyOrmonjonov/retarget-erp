services:
  postgres:
    image: postgres:16
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crm}
      POSTGRES_USER: ${DB_USERNAME:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm}
    ports:
      - "5432:5432"
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data

volumes:
  crm-postgres-data:
